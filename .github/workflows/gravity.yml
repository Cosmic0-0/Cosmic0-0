# Rebuilds the falling-contributions animation (gravity.svg) once a day,
# on every push to main, or when you click "Run workflow" in the Actions tab.
# The SVG is published to a separate branch called "output" so it never
# clutters your main branch.
name: Generate Contribution Gravity

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  gravity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: flycran/github-gravity@v3
        with:
          username: Cosmic0-0
          text: Cosmic0-0
          output-path: deploy/gravity.svg
          background-color: '#0D1117'
          text-color: '#A78BFA'
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: output
          keep_files: false
          force_orphan: true
